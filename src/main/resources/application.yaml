spring:
  application:
    name: previsao_tempo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

  jwt:
    secret: ${SECRET_KEY}
    expiration: ${EXPIRATION}
